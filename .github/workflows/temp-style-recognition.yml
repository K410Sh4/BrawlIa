name: Recognition V1 Temporary Formatting
on:
  push:
    branches:
      - refactor/recognition-v1-audit-p0
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply Black
        run: python -m black brawlla/recognition_v1 qa/benchmark_recognition_v1.py tests/test_recognition_v1_refactor.py
      - name: Commit normalized style
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add brawlla/recognition_v1 qa/benchmark_recognition_v1.py tests/test_recognition_v1_refactor.py
            git commit -m "style: normalize recognition V1 audit changes"
            git push origin HEAD:refactor/recognition-v1-audit-p0
          fi
