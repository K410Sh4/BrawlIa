name: Format Recognition V1.1 branch
on:
  push:
    branches: [feature/recognition-v1-1-context-memory]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install black==26.10.1
      - name: Format changed Python files
        run: python -m black brawlla/recognition_v1 tests/test_recognition_v11.py qa/benchmark_recognition_v1.py
      - name: Commit Black normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add brawlla/recognition_v1 tests/test_recognition_v11.py qa/benchmark_recognition_v1.py
            git commit -m "style: format recognition V1.1 with Black"
            git push origin HEAD:feature/recognition-v1-1-context-memory
          fi
