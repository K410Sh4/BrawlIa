name: BrawlIA V2 - Build Windows EXE and GitHub OTA Release

on:
  push:
    branches:
      - brawlia-v2
    paths:
      - 'v2/**'
      - '.github/workflows/brawlia-v2-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/requirements-build.txt
      - name: Install build requirements
        working-directory: v2
        run: python -m pip install -r requirements-build.txt
      - name: Validate V2 core and OTA
        working-directory: v2
        run: python -m unittest discover -s tests -v
      - name: Build Windows GUI
        working-directory: v2
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name BrawlIA-V2 --paths . run_gui.py
      - name: Build standalone updater
        working-directory: v2
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name BrawlIA-V2-Updater --paths . run_updater.py
      - name: Generate checksum manifest and portable ZIP
        working-directory: v2
        run: |
          python tools/make_manifest.py dist/BrawlIA-V2.exe dist/ota-manifest.json
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item dist/BrawlIA-V2.exe,dist/BrawlIA-V2-Updater.exe,LEIA-ME-WINDOWS.txt package/
          Compress-Archive -Path package/* -DestinationPath dist/BrawlIA-V2-Windows.zip -Force
          Get-FileHash dist/BrawlIA-V2.exe -Algorithm SHA256
          Get-ChildItem dist/*
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrawlIA-V2-Windows
          path: |
            v2/dist/BrawlIA-V2-Windows.zip
            v2/dist/BrawlIA-V2.exe
            v2/dist/BrawlIA-V2-Updater.exe
            v2/dist/ota-manifest.json
          if-no-files-found: error
      - name: Publish stable GitHub release for OTA
        if: github.ref == 'refs/heads/brawlia-v2'
        working-directory: v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "from brawlia_v2 import __version__; print(__version__)").Trim()
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Bump __version__ for a new OTA release."
          } else {
            gh release create $tag dist/BrawlIA-V2-Windows.zip dist/BrawlIA-V2.exe dist/BrawlIA-V2-Updater.exe dist/ota-manifest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "BrawlIA V2 $version - Windows" --notes "Fase 1: captura 30 FPS alvo; sem PNG/MP4; executavel portatil com verificacao de atualizacao via GitHub Releases, SHA-256 e atualizador independente." --latest
          }
