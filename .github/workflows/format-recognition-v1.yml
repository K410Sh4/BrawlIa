name: Format Recognition V1 (temporary development branch)
on:
  push:
    branches: [feature/recognition-v1-contextual]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Normalize formatting
        run: python -m black brawlla/recognition_v1 brawlla/capture.py tests/test_recognition_v1.py run_recognition_v1.py qa/benchmark_recognition_v1.py
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add brawlla/recognition_v1 brawlla/capture.py tests/test_recognition_v1.py run_recognition_v1.py
            git commit -m "style: format recognition V1 with Black"
            git push origin HEAD:feature/recognition-v1-contextual
          fi
